<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>관리자 로그인 — Soul Fingerprint</title>
    <link rel="stylesheet" href="/projects/robots/css/style.css">
</head>
<body>
    <header>
        <h1><a href="/projects/robots/" style="color: inherit; text-decoration: none;">Soul Fingerprint</a></h1>
        <p class="subtitle">관리자 로그인</p>
    </header>

    <main>
        <div class="register-section">
            <h2>관리자 인증</h2>
            <div class="register-form">
                <input type="password" id="tokenInput" placeholder="관리자 토큰 입력" autocomplete="current-password">
                <button id="loginBtn" onclick="login()">로그인</button>
            </div>
            <p id="loginError" style="color: var(--red); margin-top: 0.5rem; display: none;"></p>
        </div>
    </main>

    <footer>
        <p><a href="/projects/robots/" style="color: var(--accent);">← 검색으로 돌아가기</a></p>
    </footer>

    <script>
    const API = '/api';

    function escapeHtml(s) {
        return s ? s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;') : '';
    }

    async function login() {
        const token = document.getElementById('tokenInput').value.trim();
        const errorEl = document.getElementById('loginError');
        const btn = document.getElementById('loginBtn');

        if (!token) {
            errorEl.textContent = '토큰을 입력하세요.';
            errorEl.style.display = 'block';
            return;
        }

        btn.disabled = true;
        btn.textContent = '로그인 중...';
        errorEl.style.display = 'none';

        try {
            const res = await fetch(`${API}/admin/login`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ token })
            });

            if (res.ok) {
                window.location.href = '/projects/robots/admin';
            } else {
                const data = await res.json();
                errorEl.textContent = data.error || '로그인 실패. 토큰을 확인하세요.';
                errorEl.style.display = 'block';
            }
        } catch (err) {
            errorEl.textContent = '서버 연결 오류.';
            errorEl.style.display = 'block';
        } finally {
            btn.disabled = false;
            btn.textContent = '로그인';
        }
    }

    // Enter key support
    document.addEventListener('DOMContentLoaded', () => {
        document.getElementById('tokenInput').addEventListener('keydown', (e) => {
            if (e.key === 'Enter') login();
        });
    });
    </script>

<!-- demo-nav --><script defer src="/js/demo-nav.js" data-demo-base="/projects/robots/"></script>
</body>
</html>
