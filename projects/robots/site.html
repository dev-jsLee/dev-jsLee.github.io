<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Site Detail — Soul Fingerprint</title>
    <link rel="stylesheet" href="/projects/robots/css/style.css">
</head>
<body>
    <header>
        <h1><a href="/projects/robots/" style="color: inherit; text-decoration: none;">Soul Fingerprint</a></h1>
        <p class="subtitle">robots.txt Directory for Agents & Humans</p>
    </header>

    <main>
        <div id="siteDetail">
            <p style="color: var(--text-muted); text-align: center; padding: 2rem;">로딩 중...</p>
        </div>
    </main>

    <footer>
        <p><a href="/projects/robots/" style="color: var(--accent);">← 검색으로 돌아가기</a></p>
    </footer>

    <script>
    const API = '/api';

    async function loadSite() {
        const params = new URLSearchParams(window.location.search);
        const siteId = params.get('id');
        if (!siteId) {
            document.getElementById('siteDetail').innerHTML = 
                '<p style="color: var(--red);">사이트 ID가 필요합니다.</p>';
            return;
        }

        try {
            const res = await fetch(`${API}/sites/${siteId}`);
            if (!res.ok) {
                document.getElementById('siteDetail').innerHTML = 
                    '<p style="color: var(--red);">사이트를 찾을 수 없습니다.</p>';
                return;
            }
            const site = await res.json();
            document.title = `${site.domain} — Soul Fingerprint`;
            renderSite(site);
        } catch (err) {
            document.getElementById('siteDetail').innerHTML = 
                '<p style="color: var(--red);">로딩 중 오류가 발생했습니다.</p>';
        }
    }

    function renderSite(site) {
        let botsHtml = '';
        if (site.ai_bots_detail) {
            try {
                const bots = JSON.parse(site.ai_bots_detail);
                botsHtml = `
                    <div class="detail-section">
                        <h3>AI Bot Policies</h3>
                        <div class="bot-list">
                            ${Object.entries(bots).map(([bot, status]) => `
                                <div class="bot-item">
                                    <span class="bot-name">${escapeHtml(bot)}</span>
                                    <span class="badge badge-${status === 'allowed' ? 'yes' : status.includes('blocked') ? 'no' : 'unknown'}">${escapeHtml(status)}</span>
                                </div>
                            `).join('')}
                        </div>
                    </div>
                `;
            } catch (e) {}
        }

        document.getElementById('siteDetail').innerHTML = `
            <div class="detail-section">
                <h2 style="font-size: 1.8rem; margin-bottom: 1rem;">${escapeHtml(site.domain)}</h2>
                <p>
                    <span class="badge badge-${site.has_robots}">${robotsLabel(site.has_robots)}</span>
                    ${site.category ? `&nbsp; <span style="color: var(--text-muted);">카테고리: ${escapeHtml(site.category)}</span>` : ''}
                </p>
                ${site.last_checked ? `<p style="color: var(--text-muted); font-size: 0.85rem; margin-top: 0.3rem;">마지막 확인: ${formatDate(site.last_checked)}</p>` : ''}
            </div>

            ${site.ai_policy_summary ? `
            <div class="detail-section">
                <h3>AI Policy Summary</h3>
                <p>${escapeHtml(site.ai_policy_summary)}</p>
            </div>
            ` : ''}

            ${botsHtml}

            ${site.robots_txt ? `
            <div class="detail-section">
                <h3>robots.txt</h3>
                <div class="robots-content">${escapeHtml(site.robots_txt)}</div>
            </div>
            ` : ''}

            <div class="detail-section" style="color: var(--text-muted); font-size: 0.8rem; margin-top: 2rem; padding-top: 1rem; border-top: 1px solid var(--border);">
                <p>Registered by: ${escapeHtml(site.registered_by || 'unknown')}</p>
                <p>robots.txt URL: <a href="${escapeHtml(site.robots_url || '')}" target="_blank" style="color: var(--accent);">${escapeHtml(site.robots_url || 'N/A')}</a></p>
                <p>등록일: ${formatDate(site.created_at)}</p>
            </div>
        `;
    }

    function robotsLabel(s) {
        return {yes:'robots.txt ✓', no:'robots.txt ✗', unknown:'미확인', error:'오류'}[s] || s;
    }
    function formatDate(d) { return d ? new Date(d).toLocaleDateString('ko-KR') : ''; }
    function escapeHtml(s) { return s ? s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;') : ''; }

    loadSite();
    </script>

<!-- demo-nav --><script defer src="/js/demo-nav.js" data-demo-base="/projects/robots/"></script>
</body>
</html>
