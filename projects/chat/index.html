<!DOCTYPE html>
<html lang="ko" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CalDAVchat — 로그인</title>
  <link rel="icon" href="/projects/chat/assets/favicon.ico">
  <link rel="stylesheet" href="/projects/chat/css/common.css">
  <link rel="stylesheet" href="/projects/chat/css/login.css">
</head>
<body class="login-page">
  <div class="login-container">
    <div class="login-card">
      <div class="login-logo">
        <div class="login-logo-icon">📅</div>
        <h1 class="login-title">CalDAVchat</h1>
        <p class="login-subtitle">일정을 함께, 대화도 함께</p>
      </div>

      <!-- Auth Tabs -->
      <div class="auth-tabs">
        <button class="auth-tab active" data-tab="login">로그인</button>
        <button class="auth-tab" data-tab="register">회원가입</button>
      </div>

      <!-- Login Form -->
      <form class="auth-form" id="login-form">
        <div class="auth-error" id="login-error"></div>
        <input class="auth-form-input" type="email" id="login-email" placeholder="이메일" required>
        <input class="auth-form-input" type="password" id="login-password" placeholder="비밀번호" required>
        <button class="auth-submit-btn" type="submit">로그인</button>
      </form>

      <!-- Register Form (hidden by default) -->
      <form class="auth-form" id="register-form" style="display:none">
        <div class="auth-error" id="register-error"></div>
        <input class="auth-form-input" type="email" id="register-email" placeholder="이메일" required>
        <input class="auth-form-input" type="password" id="register-password" placeholder="비밀번호 (6자 이상)" required minlength="6">
        <input class="auth-form-input" type="password" id="register-confirm" placeholder="비밀번호 확인" required minlength="6">
        <button class="auth-submit-btn" type="submit">회원가입</button>
      </form>

      <!-- OAuth (hidden — preserved for future use) -->
      <div class="oauth-buttons" style="display:none">
        <button type="button" class="oauth-btn" data-provider="google">
          <svg class="oauth-icon" viewBox="0 0 24 24" width="20" height="20" aria-hidden="true">
            <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
            <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
            <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/>
            <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
          </svg>
          Google로 계속하기
        </button>
        <button type="button" class="oauth-btn" data-provider="apple">
          <svg class="oauth-icon" viewBox="0 0 24 24" width="20" height="20" fill="currentColor" aria-hidden="true">
            <path d="M18.71 19.5c-.83 1.24-1.71 2.45-3.05 2.47-1.34.03-1.77-.79-3.29-.79-1.53 0-2 .77-3.27.82-1.31.05-2.3-1.32-3.14-2.53C4.25 17 2.94 12.45 4.7 9.39c.87-1.52 2.43-2.48 4.12-2.51 1.28-.02 2.5.87 3.29.87.78 0 2.26-1.07 3.8-.91.65.03 2.47.26 3.64 1.98-.09.06-2.17 1.28-2.15 3.81.03 3.02 2.65 4.03 2.68 4.04-.03.07-.42 1.44-1.38 2.83M13 3.5c.73-.83 1.94-1.46 2.94-1.5.13 1.17-.34 2.35-1.04 3.19-.69.85-1.83 1.51-2.95 1.42-.15-1.15.41-2.35 1.05-3.11z"/>
          </svg>
          Apple로 계속하기
        </button>
        <button type="button" class="oauth-btn" data-provider="microsoft">
          <svg class="oauth-icon" viewBox="0 0 24 24" width="20" height="20" aria-hidden="true">
            <rect x="1" y="1" width="10" height="10" fill="#F25022"/>
            <rect x="13" y="1" width="10" height="10" fill="#7FBA00"/>
            <rect x="1" y="13" width="10" height="10" fill="#00A4EF"/>
            <rect x="13" y="13" width="10" height="10" fill="#FFB900"/>
          </svg>
          Microsoft로 계속하기
        </button>
      </div>

      <p class="login-notice">로그인하면 <a href="#">이용약관</a> 및 <a href="#">개인정보처리방침</a>에 동의하게 됩니다.</p>
    </div>
  </div>

  <script type="module" src="/projects/chat/js/login.js"></script>
  <script type="module">
    import '/js/theme.js';
  </script>
</body>
</html>
