<!DOCTYPE html>
<html lang="ko" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CalDAVchat — 검색</title>
  <link rel="icon" href="/projects/chat/assets/favicon.ico">
  <link rel="stylesheet" href="/projects/chat/css/common.css">
  <link rel="stylesheet" href="/projects/chat/css/search.css">
</head>
<body class="search-page">
  <header class="search-header">
    <button type="button" class="btn btn-ghost back-btn" onclick="history.back()">← 뒤로</button>
    <div class="search-bar">
      <input type="search" class="input search-input" id="search-input" placeholder="일정 검색..." autofocus aria-label="일정 검색">
      <button type="button" class="btn btn-primary search-btn" id="search-btn" aria-label="검색">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/>
        </svg>
      </button>
    </div>
  </header>

  <main class="page-container">
    <div class="search-result-count" id="search-result-count" aria-live="polite"></div>
    <div class="event-list" id="search-results"></div>
  </main>

  <script type="module" src="/projects/chat/js/search.js"></script>
  <script type="module">
    import '/js/theme.js';
  </script>

<!-- demo-nav --><script defer src="/js/demo-nav.js" data-demo-base="/projects/chat/"></script>
</body>
</html>
