<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FuncSound 🎵 - 함수를 소리로</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/mathjs/12.4.0/math.min.js"></script>
</head>
<body>
    <div class="container">
        <!-- Header -->
        <header>
            <h1>🎵 FuncSound</h1>
            <p class="subtitle">수학 함수를 소리로 변환하는 웹앱</p>
            <button id="themeToggle" class="theme-toggle" aria-label="테마 전환">🌓</button>
        </header>

        <!-- Main Controls -->
        <section class="controls-main">
            <div class="input-group">
                <label for="functionInput">함수 입력</label>
                <input 
                    type="text" 
                    id="functionInput" 
                    placeholder="예: sin(x), x^2, sin(x) + 0.5*cos(2*x)"
                    value="sin(x)"
                >
            </div>
            
            <div class="button-group">
                <button id="playBtn" class="btn btn-primary">▶️ 재생</button>
                <button id="pauseBtn" class="btn btn-secondary" disabled>⏸️ 일시정지</button>
                <button id="stopBtn" class="btn btn-danger" disabled>⏹️ 정지</button>
            </div>
        </section>

        <!-- Preset Functions -->
        <section class="presets">
            <h3>프리셋</h3>
            <div class="preset-buttons">
                <button class="preset-btn" data-func="sin(x)">sin(x)</button>
                <button class="preset-btn" data-func="cos(x)">cos(x)</button>
                <button class="preset-btn" data-func="x^2">x²</button>
                <button class="preset-btn" data-func="sin(x) + 0.5*cos(2*x)">화음</button>
                <button class="preset-btn" data-func="abs(sin(x))">|sin(x)|</button>
                <button class="preset-btn" data-func="tan(x/4)">tan(x/4)</button>
                <button class="preset-btn" data-func="sin(x) * cos(x)">sin·cos</button>
                <button class="preset-btn" data-func="x * sin(x)">x·sin(x)</button>
            </div>
            
            <h3>음악 프리셋</h3>
            <div class="preset-buttons">
                <button class="preset-btn" data-func="sin(2*pi*440/6.28*x)">A4 (440Hz)</button>
                <button class="preset-btn" data-func="sin(x) + sin(1.5*x) + sin(2*x)">메이저 코드</button>
                <button class="preset-btn" data-func="sin(x) + sin(1.2*x) + sin(1.5*x)">마이너 코드</button>
                <button class="preset-btn" data-func="0.5*sin(x) + 0.3*sin(2*x) + 0.2*sin(3*x)">배음 시리즈</button>
                <button class="preset-btn" data-func="sin(x) * (1 + 0.3*sin(5*x))">비브라토</button>
                <button class="preset-btn" data-func="(1 + sin(10*x))/2 * sin(x)">트레몰로</button>
                <button class="preset-btn" data-func="x > 0 ? sin(x) : -sin(x)">톱니파</button>
                <button class="preset-btn" data-func="sin(x) + 0.5*sin(3*x) + 0.3*sin(5*x)">사각파 근사</button>
            </div>
        </section>

        <!-- Canvas Graph -->
        <section class="graph-container">
            <canvas id="graphCanvas"></canvas>
        </section>

        <!-- Extrema Editor -->
        <section class="extrema-editor">
            <div class="extrema-controls">
                <button id="editModeBtn" class="btn btn-edit">✏️ 극값 편집 모드</button>
                <button id="resetExtremaBtn" class="btn btn-secondary">↩️ 초기화</button>
                <span id="extremaStatus" class="extrema-status">극값 탐지 대기 중</span>
            </div>
        </section>

        <!-- Settings -->
        <section class="settings">
            <h3>설정</h3>
            
            <div class="settings-grid">
                <div class="setting-item">
                    <label for="speedSlider">
                        재생 속도: <span id="speedValue">1.0</span>x
                    </label>
                    <input 
                        type="range" 
                        id="speedSlider" 
                        min="0.5" 
                        max="3" 
                        step="0.1" 
                        value="1"
                    >
                </div>

                <div class="setting-item">
                    <label for="minFreq">
                        최소 주파수: <span id="minFreqValue">220</span> Hz
                    </label>
                    <input 
                        type="range" 
                        id="minFreq" 
                        min="20" 
                        max="880" 
                        step="10" 
                        value="220"
                    >
                </div>

                <div class="setting-item">
                    <label for="maxFreq">
                        최대 주파수: <span id="maxFreqValue">880</span> Hz
                    </label>
                    <input 
                        type="range" 
                        id="maxFreq" 
                        min="220" 
                        max="2000" 
                        step="10" 
                        value="880"
                    >
                </div>

                <div class="setting-item">
                    <label for="waveform">파형</label>
                    <select id="waveform">
                        <option value="sine">사인파 (Sine)</option>
                        <option value="square">사각파 (Square)</option>
                        <option value="sawtooth">톱니파 (Sawtooth)</option>
                        <option value="triangle">삼각파 (Triangle)</option>
                    </select>
                </div>
            </div>
        </section>

        <!-- Info -->
        <section class="info">
            <p>💡 <strong>팁:</strong> 함수는 math.js 문법을 사용합니다. 예: <code>sin(x)</code>, <code>x^2</code>, <code>sqrt(x)</code>, <code>abs(x)</code></p>
            <p id="errorMsg" class="error-msg"></p>
        </section>

        <!-- Footer -->
        <footer>
            <p>Made with ❤️ for math and music lovers | <a href="https://github.com" target="_blank">GitHub</a></p>
        </footer>
    </div>

    <script src="app.js"></script>
</body>
</html>
