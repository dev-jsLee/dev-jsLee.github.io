<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portfolio — jsLee</title>
    <meta name="description" content="개발자 jsLee의 포트폴리오">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&display=swap">

    <link rel="stylesheet" href="css/landing.css">
    <link rel="stylesheet" href="css/header.css">

    <!-- 저장된 테마를 스타일 적용 전에 미리 반영 (FOUC 방지) -->
    <script>
      (function () {
        try {
          var t = localStorage.getItem('theme');
          if (t) document.documentElement.dataset.theme = t;
        } catch (e) {}
      })();
    </script>

    <script src="https://unpkg.com/lucide@0.294.0/dist/umd/lucide.min.js"></script>
</head>
<body>
    <header class="hero" data-screen-label="hero">
        <div class="hero-inner">
            <p class="hero-prompt"><span class="tilde">~</span>/portfolio $ whoami<span class="cursor"></span></p>
            <h1 data-hero="developer"></h1>
            <p class="tagline" data-hero="tagline"></p>
            <div class="hero-stack" data-hero="stack"></div>
            <div class="hero-links" data-hero="links"></div>
        </div>
    </header>

    <main>
        <section class="about" id="about-section" hidden data-screen-label="about">
            <div class="section-head">
                <h2 data-index="01" data-about="heading">자기소개</h2>
            </div>
            <div class="about-qa" id="about-qa"></div>
        </section>

        <section class="projects" id="projects" data-screen-label="projects">
            <div class="section-head">
                <h2 data-index="02">프로젝트</h2>
            </div>
            <div class="project-grid" id="project-grid"></div>
        </section>
    </main>

    <footer>
        <div class="footer-inner">
            <p data-hero="footer"></p>
            <p><a data-hero="repo" href="#" target="_blank" rel="noopener">repository ↗</a></p>
        </div>
    </footer>

    <script src="js/header.js" type="module"></script>
    <script src="js/landing.js" type="module"></script>
</body>
</html>
